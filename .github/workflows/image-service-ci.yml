name: Image Processing CI
on:
  push:
    branches: [main]
    paths: ["image-processing-service/**", ".github/workflows/image-service-ci.yml"]
  pull_request:
    paths: ["image-processing-service/**", ".github/workflows/image-service-ci.yml"]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IMAGE_TEST_REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: image-processing-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python tests/redis_workflow_check.py
