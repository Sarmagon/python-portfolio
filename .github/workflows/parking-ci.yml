name: Parking CI

on:
  push:
    branches: [main, master]
    paths:
      - "parking-api/**"
      - ".github/workflows/parking-ci.yml"
  pull_request:
    paths:
      - "parking-api/**"
      - ".github/workflows/parking-ci.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: parking-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test API
        run: python -m pytest -q
